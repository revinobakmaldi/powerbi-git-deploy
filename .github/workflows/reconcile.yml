# Daily: put refresh schedules back to config/refresh-schedule.json. Needs no repo change to run.
name: Reconcile refresh schedules

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 in Jakarta
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python scripts/reconcile.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
